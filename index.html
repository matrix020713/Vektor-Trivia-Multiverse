<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektor - Trivia Platform</title>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>

        /* Deep space gradient background canvas */
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0f1d 0%, #03050a 100%);
            position: relative;
            overflow: hidden;
        }

        /* Ambient Nebula Gas Layer */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(0, 242, 254, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 10%, rgba(232, 93, 68, 0.08) 0%, transparent 40%);
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        /* Dynamic Star Field Layer */
        .star-field {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star-field::after {
            content: '';
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 
                10vw 15vh 1px #fff, 25vw 35vh 2px #fff, 85vw 12vh 1px #fff,
                5vw 65vh 2px #fff, 40vw 50vh 1px #fff, 75vw 70vh 2px #fff,
                20vw 85vh 1px #fff, 60vw 92vh 2px #fff, 92vw 55vh 1px #fff,
                15vw 40vh 1px #fff, 55vw 78vh 2px #fff, 80vw 35vh 1px #fff,
                33vw 65vh 1px #fff, 68vw 18vh 2px #fff, 95vw 88vh 1px #fff;
            animation: spaceTwinkle 4s ease-in-out infinite alternate;
        }
        @keyframes spaceTwinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .space-object {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        /* Swirling Black Hole (Top Left) */
        .black-hole {
            top: 15vh;
            left: 5vw;
            width: 90px;
            height: 90px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 20px #000, 0 0 40px #7000ff, 0 0 60px #ff007f;
            animation: floatingGlow 6s infinite ease-in-out;
        }
        .black-hole::before {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border: 3px double rgba(0, 242, 254, 0.4);
            border-radius: 50%;
            border-left-color: transparent;
            border-right-color: transparent;
            animation: rotateRing 8s infinite linear;
        }

        /* Ringed Gas Giant Planet (Bottom Right) */
        .gas-giant {
            bottom: 12vh;
            right: 5vw;
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #ff7a63 0%, #7000ff 100%);
            border-radius: 50%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 122, 99, 0.3);
        }
        .gas-giant::before {
            content: '';
            position: absolute;
            top: 38px; left: -35px;
            width: 165px;
            height: 20px;
            border: 6px solid rgba(255, 255, 255, 0.15);
            border-top-color: transparent;
            border-radius: 50%;
            transform: rotate(-15deg);
        }

        /* Distant Dark Outpost Moon (Top Right) */
        .mystic-moon {
            top: 15vh;
            right: 8vw;
            width: 35px;
            height: 35px;
            background: #2d3748;
            border-radius: 50%;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.9), 0 0 10px rgba(0, 242, 254, 0.15);
        }

        /* Streaking Comet (Top Center) */
        .comet {
            top: 6vh;
            left: 45vw;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 2px #fff;
            animation: shootComet 12s infinite linear;
            opacity: 0;
        }
        .comet::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 2px;
            width: 80px;
            height: 2px;
            background: linear-gradient(to left, rgba(255,255,255,0.7), transparent);
            transform: translateY(-50%) rotate(-25deg);
            transform-origin: left center;
        }

        /* Spinning Spiral Galaxy (Middle Left) */
        .spiral-galaxy {
            top: 48vh;
            left: 3vw;
            width: 70px;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0, 242, 254, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(2px);
            transform: rotate(-30deg);
            animation: rotateRing 25s infinite linear;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        /* Glowing Star Cluster (Middle Right) */
        .star-cluster {
            top: 50vh;
            right: 4vw;
            width: 40px;
            height: 40px;
            background: transparent;
            box-shadow: 
                5px 5px 2px #00ffff, -8px 12px 1px #fff, 12px -5px 3px rgba(0,242,254,0.7),
                -3px -8px 2px #fff, 8px 15px 1px rgba(112, 0, 255, 0.6);
            filter: blur(1px);
            animation: floatingGlow 5s infinite ease-in-out alternate;
        }

        /* Fiery Solar Flare Star (Bottom Left) */
        .solar-star {
            bottom: 8vh;
            left: 8vw;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at center, #fff 20%, #ff7a63 60%, #e85d44 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px #ff7a63, 0 0 45px rgba(232, 93, 68, 0.5);
            animation: floatingGlow 7s infinite ease-in-out;
        }

        /* CSS Animations for Space Elements */
        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes floatingGlow {
            0% { transform: translateY(0px); filter: brightness(1); }
            50% { transform: translateY(-8px); filter: brightness(1.2); }
            100% { transform: translateY(0px); filter: brightness(1); }
        }
        @keyframes shootComet {
            0% { transform: translateX(0) translateY(0); opacity: 0; }
            5% { opacity: 1; }
            15% { transform: translateX(-25vw) translateY(12vh); opacity: 0; }
            100% { transform: translateX(-25vw) translateY(12vh); opacity: 0; }
        }
        
        .hero-panel{
            position:relative;
            overflow:hidden;

            width:90%;
            max-width:475px;
            padding:46px 56px;

            text-align:center;
            color:white;

            border-radius:32px;

            background:
                linear-gradient(180deg,#132346,#101c39);

            border:1px solid rgba(55,220,255,.35);

            box-shadow:
                0 0 18px rgba(0,242,254,.2),
                0 0 55px rgba(0,170,255,.12);

            z-index:2;
        }

        .hero-panel::before{
            content:"";
            position:absolute;
            inset:0;

            background:
            repeating-linear-gradient(
                -45deg,
                transparent 0,
                transparent 18px,
                rgba(255,255,255,.03) 18px,
                rgba(255,255,255,.03) 20px
            );

            pointer-events:none;
        }

        h1{

            filter:
                drop-shadow(0 0 12px rgba(120,255,255,.25))
                drop-shadow(0 0 22px rgba(180,120,255,.18));
            font-family:'Plus Jakarta Sans',sans-serif;
            font-size:15rem;
            font-weight:900;
            margin:0;
            line-height:1;

            background: linear-gradient(
                115deg,
                #ffffff 0%,
                #dffcff 8%,
                #7cecff 16%,
                #74ffd3 24%,
                #d6ff73 32%,
                #ffe56d 40%,
                #ffffff 48%,
                #ffc6f7 58%,
                #c0a8ff 68%,
                #7edbff 78%,
                #8bffe3 88%,
                #ffffff 100%
            );

            background-size: 350% 350%;

            background-size:300% 300%;

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            color:transparent;

            animation:prismFlow 8s ease-in-out infinite;

            text-shadow:
                0 0 18px rgba(120,220,255,.25),
                0 0 40px rgba(170,120,255,.18);
        }

        @keyframes prismFlow{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }

        }

        h2{
            font-size: 1.875rem;
            font-weight: 400;
            margin: 0.5rem 0 2rem 0;
            color: #a0aec0;
        }

        p{
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e0;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .main-actions{
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 2.5rem;
        }

        @media (min-width: 480px){
            .main-actions { grid-template-columns: 2fr 1fr 1fr; }
        }

        .action-link{
            font-weight: 600;
            font-size: 0.95rem;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;

        }

        .footer-note{
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 3rem;
        }

        .top-nav{

            position:absolute;

            top:22px;
            right:35px;

            display:flex;
            gap:16px;

            z-index:999;

        }

        .nav-btn{

            display:flex;

            align-items:center;
            justify-content:center;

            padding:12px 22px;

            border-radius:14px;

            text-decoration:none;

            font-family:'Plus Jakarta Sans',sans-serif;

            font-size:16px;

            font-weight:700;

            color:white;

            background:linear-gradient(135deg,#49c4ff,#6a49ff);

            border:1px solid rgba(255,255,255,.18);

            box-shadow:
                0 0 12px rgba(0,198,255,.35),
                inset 0 1px 0 rgba(255,255,255,.15);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;

        }

        .nav-btn:hover{

            transform:translateY(-2px);

            filter:brightness(1.08);

            box-shadow:
                0 0 20px rgba(0,198,255,.6),
                0 0 40px rgba(95,70,255,.3);

        }

        .guest-btn{

            background:linear-gradient(135deg,#49c4ff,#6a49ff);

        }

        /* Confetti Elements Wrapper */
        .confetti-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none;
            z-index: 1;
        }

        .confetti {
            position: absolute;
            top: -20px; width: 12px; height: 12px;
            opacity: 0.4;
            border-radius: 50%;
            animation: fall 4s infinite linear;
        }

        @media (max-width: 900px) {
            /* Hides background objects on narrower windows so the screen doesn't clutter */
            .space-object { display: none; }
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

    </style>
    
</head>
<body>

    <!-- Stars field container -->
    <div class="star-field"></div>

    <!-- Active Celestial Objects Structure -->
    <div class="space-object black-hole"></div>
    <div class="space-object gas-giant"></div>
    <div class="space-object mystic-moon"></div>
    <div class="space-object comet"></div>
    <div class="space-object spiral-galaxy"></div>
    <div class="space-object star-cluster"></div>
    <div class="space-object solar-star"></div>

    <nav class="top-nav">
        <a href="home.html" class="nav-btn guest-btn" id="guestBtn">⭐ Play as Guest</a>
        <a href="signup.html" class="nav-btn">👤 Sign Up</a>
        <a href="login.html" class="nav-btn">🔒 Log In</a>
    </nav>

    <!-- Main Central Application Card Box -->
    <div>
        <h1>Vektor</h1>
    </div>

    <!-- Confetti elements tracker -->
    <div class="confetti-container">
        <div class="confetti" style="left:10%; background: #ff007f; animation-delay: 0s;"></div>
        <div class="confetti" style="left:30%; background: #00ffff; animation-delay: 2s;"></div>
        <div class="confetti" style="left:50%; background: #ffff00; animation-delay: 1s;"></div>
        <div class="confetti" style="left:80%; background: #7000ff; animation-delay: 3s;"></div>
    </div>

    <!-- Hanging flag banner -->
    <svg viewBox="0 0 100 20" style="position: absolute; top: 0; width: 100%; z-index: 3; pointer-events: none;">
        <path d="M0,0 Q25,12 50,0 Q75,12 100,0" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.2"/>
        <polygon points="3,4.3 13,2.3 8,12" fill="#ff007f" />
        <polygon points="18,4.5 28,4.5 23,13" fill="#00ffff" />
        <polygon points="72,4.5 82,4.5 77,13" fill="#ffff00" />
        <polygon points="87,2.3 97,4.3 92,12" fill="#7000ff" />
    </svg>

    <audio id="bg-music" loop preload="auto">
        <source src="music/home.mp3" type="audio/mpeg">
    </audio>

    <audio id="button-click" preload="auto">
        <source src="soundeffects/buttonclick.mp3" type="audio/mpeg">
    </audio>

    <script>

        const buttonClick = document.getElementById("button-click");
        buttonClick.volume = 1;
        
        // Unlock audio after first interaction
        document.addEventListener("click", async () => {
        
            try{
        
                buttonClick.muted = true;
                buttonClick.currentTime = 0;
        
                await buttonClick.play();
        
                buttonClick.pause();
                buttonClick.currentTime = 0;
                buttonClick.muted = false;
        
            }catch(e){}
        
        }, { once:true });

        const guestBtn = document.getElementById("guestBtn");

        guestBtn.addEventListener("click", function () {

            sessionStorage.setItem("guest", "true");

            localStorage.removeItem("currentUser");

            localStorage.setItem("playerXP", 0);
            localStorage.setItem("playerLevel", 1);
            localStorage.setItem("previousXP", 0);
            localStorage.setItem("pendingXP", 0);

            localStorage.removeItem("quizStats");
            localStorage.removeItem("dailyQuests");
            localStorage.removeItem("questResetTime");

        });
        
        document.querySelectorAll(".nav-btn").forEach(button => {
        
            button.addEventListener("click", function(e){
        
                e.preventDefault();
        
                buttonClick.pause();
                buttonClick.currentTime = 0;
        
                buttonClick.play();
        
                const destination = this.href;
        
                setTimeout(() => {
        
                    window.location.href = destination;
        
                }, 180);
        
            });
        
        });
    
    </script>

</body>
</html>
